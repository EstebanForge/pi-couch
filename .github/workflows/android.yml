name: android

# Manual only: the APK moves on its own schedule, never with the server.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # With the secrets present the build signs itself with the real
      # upload key (the build falls back to the debug keystore without
      # them, so the workflow still proves the APK compiles). The
      # properties file stays out of the repo; the build.gradle.kts
      # looks for exactly this path.
      - name: Restore signing key
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
          cat > keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Short retention: private-repo artifacts eat the account storage
      # quota, and the quota refill takes hours.
      - uses: actions/upload-artifact@v4
        with:
          name: pi-couch-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
