name: android

# Manual only: the APK moves on its own schedule, never with the server.
on:
  workflow_dispatch:

permissions: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # With the secrets present the build signs itself with the real
      # upload key (the build falls back to the debug keystore without
      # them, so the workflow still proves the APK compiles). The
      # properties file stays out of the repo; the build.gradle.kts
      # looks for exactly this path. Secrets ride env vars, never
      # templated into the script: a quote in a password must not be
      # able to break out of the heredoc.
      - name: Restore signing key
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Short retention: private-repo artifacts eat the account storage
      # quota, and the quota refill takes hours.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-couch-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
