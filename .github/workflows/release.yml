name: release

# Manual only. The default release path is scripts/release.sh on the
# dev machine: CI runs the same gates locally and publishes the same
# assets, so this workflow exists only as a fallback and never runs
# on push. The Android APK is a separate lifecycle (android.yml).
on:
  workflow_dispatch:

jobs:
  # The full suite gates the release; this job holds no write
  # permissions at all.
  verify:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test ./...

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web gates
        working-directory: web
        run: |
          npm ci
          npm run check
          ./node_modules/.bin/vitest run

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # The published tag is the unprefixed date version the checked-
      # out commit carries.
      - name: Check the version is a date
        run: |
          set -euo pipefail
          want="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/server/version.go)"
          case "$want" in
            v*|*[!0-9.]*) echo "::error::version.go must be an unprefixed date version (20261029), not $want"; exit 1 ;;
          esac

      # The binary embeds the SPA (vite emits straight into
      # internal/web/app), so the web build comes first and once.
      - name: Build the SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cross-build
        run: |
          set -euo pipefail
          mkdir dist
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${pair%/*}
            arch=${pair#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "dist/pi-couch-$os-$arch" ./cmd/couch-pi
          done
          (cd dist && sha256sum pi-couch-* > checksums.txt)
          ls -la dist/

      - name: Tag the release at version.go
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          want="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/server/version.go)"
          git tag "$want"
          git push origin "$want"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/server/version.go)"
          gh release create "$want" dist/pi-couch-* dist/checksums.txt \
            --title "$want" \
            --generate-notes
