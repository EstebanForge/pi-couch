name: release

# Tag push publishes the release: four static server binaries plus a
# checksums.txt, which the self-updater verifies before it runs the
# download. The Android APK is a separate lifecycle and stays manual
# (android.yml).
on:
  push:
    tags: ['*']

jobs:
  # The full suite gates the release; this job holds no write
  # permissions at all.
  verify:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test ./...

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web gates
        working-directory: web
        run: |
          npm ci
          npm run check
          ./node_modules/.bin/vitest run

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # Tags are unprefixed date versions and must name the version the
      # tagged commit actually carries.
      - name: Check the tag names the version
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            v*) echo "::error::tags are unprefixed date versions (20261029), not ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          want="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/server/version.go)"
          if [ "${GITHUB_REF_NAME}" != "$want" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version.go (${want})"
            exit 1
          fi

      # The binary embeds the SPA (vite emits straight into
      # internal/web/app), so the web build comes first and once.
      - name: Build the SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cross-build
        run: |
          set -euo pipefail
          mkdir dist
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${pair%/*}
            arch=${pair#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "dist/pi-couch-$os-$arch" ./cmd/couch-pi
          done
          (cd dist && sha256sum pi-couch-* > checksums.txt)
          ls -la dist/

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/pi-couch-* dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
